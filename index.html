<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Together</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💞</text></svg>">
<style>
:root {
  --bg: #f7f6f4; --panel: #ffffff; --ink: #1d1d1f; --muted: #6b6b70; --line: #e6e4e0; --line-strong: #cfcdc8;
  --love: #e0457b; --love-soft: rgba(224,69,123,.10); --sel: rgba(224,69,123,.16); --now: #e0453a;
  --arturo: #7b4fd1; --zosia: #2e9b57;
  --hour: 40px; --shadow: 0 1px 2px rgba(0,0,0,.06), 0 6px 20px rgba(0,0,0,.08);
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #151517; --panel: #1e1e21; --ink: #ececee; --muted: #9a9aa2; --line: #2c2c31; --line-strong: #3a3a40;
    --love: #ff6b9b; --love-soft: rgba(255,107,155,.12); --sel: rgba(255,107,155,.2); --arturo: #9b76ec; --zosia: #43b872; --shadow: 0 1px 2px rgba(0,0,0,.4); }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Ubuntu, sans-serif; display: flex; flex-direction: column; }
button, select, input, textarea { font: inherit; color: inherit; }
button { background: var(--panel); border: 1px solid var(--line-strong); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
button:hover { border-color: var(--love); }
button.primary { background: var(--love); border-color: var(--love); color: #fff; }
button.danger { color: var(--now); }
button.link { border: 0; background: none; padding: 0; color: var(--love); }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; flex-wrap: nowrap; }
.seg button { border: 0; border-radius: 0; padding: 6px 11px; white-space: nowrap; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--love); color: #fff; }

header { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
header h1 { font-size: 16px; margin: 0 6px 0 0; white-space: nowrap; }
#label { font-weight: 600; min-width: 150px; }
.spacer { flex: 1; }
#status { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
#status i { width: 8px; height: 8px; border-radius: 50%; background: #3bb54a; display: inline-block; }
#status.demo i { background: #e0a43a; } #status.down i { background: var(--now); }
#meBtn { font-weight: 600; }
#meBtn .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }

main { flex: 1; display: flex; min-height: 0; }
aside { width: 320px; flex: none; border-right: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 4px 16px 24px; }
aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 0 8px; display: flex; align-items: center; gap: 6px; }
aside h2 span { flex: 1; }
.hint { font-size: 12px; color: var(--muted); }
.list { list-style: none; margin: 0; padding: 0; }
.list li { display: flex; align-items: center; gap: 8px; padding: 6px 4px; border-bottom: 1px solid var(--line); cursor: pointer; border-radius: 4px; }
.list li:hover { background: var(--sel); }
.list li .n { flex: 1; min-width: 0; }
.list li .n div:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list li .tags { font-size: 11px; color: var(--muted); }
.list li .cnt { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.list li.arch { opacity: .5; }
#aside .list li { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
body.dragging, body.dragging * { cursor: grabbing !important; }
.ghost { position: fixed; z-index: 60; pointer-events: none; background: var(--panel); border: 2px solid var(--love); border-radius: 16px; padding: 4px 10px; font-size: 13px; box-shadow: var(--shadow); white-space: nowrap; }
.plan.droptarget { outline: 3px solid var(--love); outline-offset: 2px; }
.list .emo { font-size: 18px; width: 24px; text-align: center; flex: none; }
.legend { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; font-size: 12px; }
.legend div { display: flex; align-items: center; gap: 6px; }
.legend .sw { width: 22px; height: 14px; border-radius: 3px; flex: none; }
.btnrow { display: flex; gap: 6px; flex-wrap: wrap; }
.btnrow button { flex: 1; }

.filters { display: flex; flex-direction: column; gap: 6px; margin: 8px 0; }
.filters .r { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.filters select, .filters input[type=search] { flex: 1; min-width: 0; }
.filters label { font-size: 13px; display: inline-flex; align-items: center; gap: 4px; }
.filters .seg button { padding: 4px 9px; font-size: 13px; }

#cal { flex: 1; display: flex; flex-direction: column; min-width: 0; }
#calHead { border-bottom: 1px solid var(--line); background: var(--panel); padding-right: 12px; }
.hrow { display: flex; }
.gut { width: 46px; flex: none; }
.dh { flex: 1; padding: 6px 4px; text-align: center; cursor: pointer; border-left: 1px solid var(--line); min-width: 0; }
.dh:hover { background: var(--sel); }
.dh .d { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dh.today .d { color: var(--love); }
.dh .chips { display: flex; gap: 3px; justify-content: center; flex-wrap: wrap; min-height: 18px; margin-top: 2px; }
.mchip, .pchip { font-size: 10px; padding: 1px 6px; border-radius: 10px; white-space: nowrap; }
.mchip { color: var(--love); border: 1px dashed var(--love); }
.mchip.strong { background: var(--love); color: #fff; border-style: solid; }
.pchip { background: var(--ink); color: var(--bg); }
#calScroll { flex: 1; overflow-y: scroll; position: relative; }
#calBody { display: flex; position: relative; }
.gutter { width: 46px; flex: none; position: relative; }
.gutter div { position: absolute; right: 6px; font-size: 11px; color: var(--muted); transform: translateY(-50%); }
.col { flex: 1; position: relative; border-left: 1px solid var(--line); height: calc(var(--hour) * 24); min-width: 0;
  background-image: repeating-linear-gradient(to bottom, var(--line) 0 1px, transparent 1px var(--hour));
  user-select: none; -webkit-user-select: none; touch-action: pan-y; }
.col.today { background-color: rgba(224,69,123,.03); }
.av { position: absolute; border-radius: 3px; overflow: hidden; cursor: pointer; font-size: 10px; line-height: 1.2; padding: 2px 3px; }
.av span { font-weight: 600; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.av:hover { filter: brightness(1.1); outline: 1px solid var(--ink); z-index: 3; }
.match { position: absolute; left: 1px; right: 1px; border: 2px dashed var(--love); border-radius: 6px; background: var(--love-soft); pointer-events: none; z-index: 2; }
.match.strong { border-style: solid; }
.mbtn { pointer-events: auto; position: absolute; left: 50%; top: 3px; transform: translateX(-50%); font-size: 10px; font-weight: 600; padding: 1px 7px; border-radius: 10px;
  background: var(--love); color: #fff; border: 0; white-space: nowrap; max-width: calc(100% - 6px); overflow: hidden; text-overflow: ellipsis; }
.mbtn:hover { filter: brightness(1.1); }
.match:not(.strong) .mbtn { background: var(--panel); color: var(--love); border: 1px solid var(--love); }
.plan { position: absolute; border-radius: 6px; padding: 2px 6px; overflow: hidden; font-size: 11px; line-height: 1.25; cursor: pointer; z-index: 4; box-shadow: var(--shadow); }
.plan.prop { background: var(--panel); border: 2px dashed var(--love); color: var(--ink); }
.plan.conf { background: var(--love); color: #fff; border: 2px solid var(--love); }
.plan:hover { outline: 2px solid var(--ink); z-index: 5; }
.plan b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.plan .em { letter-spacing: 1px; white-space: nowrap; overflow: hidden; }
.plan .wait { opacity: .75; font-size: 10px; }
.sel { position: absolute; left: 0; right: 0; background: var(--sel); border: 1px solid var(--love); pointer-events: none; z-index: 6; font-size: 11px; padding: 1px 4px; }
.now { position: absolute; left: 0; right: 0; height: 2px; background: var(--now); z-index: 7; pointer-events: none; }

dialog { border: 1px solid var(--line-strong); border-radius: 12px; background: var(--panel); color: var(--ink); padding: 0; width: min(560px, 96vw); box-shadow: var(--shadow); }
dialog::backdrop { background: rgba(0,0,0,.35); }
.dlg-h { padding: 12px 16px; border-bottom: 1px solid var(--line); font-weight: 600; display: flex; align-items: center; gap: 8px; }
.dlg-h .x { margin-left: auto; border: 0; padding: 0 4px; }
.dlg-b { padding: 14px 16px; max-height: 76vh; overflow-y: auto; }
.dlg-b section { margin-bottom: 16px; }
.dlg-b h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; }
.row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
.row > label:first-child { min-width: 64px; color: var(--muted); font-size: 13px; }
input[type=text], input[type=number], input[type=search], select, textarea { background: var(--bg); border: 1px solid var(--line-strong); border-radius: 6px; padding: 5px 8px; }
textarea { width: 100%; resize: vertical; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.actions .spacer { flex: 1; }

.picker { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; max-height: 300px; overflow-y: auto; padding: 2px; }
.pk { display: inline-flex; align-items: center; gap: 5px; border-radius: 16px; padding: 4px 10px; font-size: 13px; border: 1px solid var(--line-strong); background: var(--panel); }
.pk .dots { display: inline-flex; gap: 2px; }
.pk .dots i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.pk.mine { border: 2px solid var(--mecolor); background: color-mix(in srgb, var(--mecolor) 14%, var(--panel)); padding: 3px 9px; }
.pk.both { border: 2px solid var(--love); background: var(--love-soft); padding: 3px 9px; font-weight: 600; }
.pk.chosen { outline: 3px solid var(--love); outline-offset: 1px; }
.pk.arch { opacity: .55; }
.matchline { padding: 8px 10px; border-radius: 8px; background: var(--love-soft); border: 1px solid var(--love); font-size: 13px; }
.matchline.none { background: var(--bg); border-color: var(--line-strong); color: var(--muted); }
.big { font-size: 56px; text-align: center; margin: 4px 0; }
.bigname { font-size: 20px; font-weight: 600; text-align: center; }
.center { text-align: center; }
.who { display: flex; gap: 12px; justify-content: center; margin: 10px 0; }
.who button { font-size: 18px; padding: 14px 24px; color: #fff; border: 0; font-weight: 600; }
.stats { display: flex; gap: 18px; flex-wrap: wrap; margin-bottom: 12px; }
.stats div { display: flex; flex-direction: column; }
.stats b { font-size: 20px; font-variant-numeric: tabular-nums; }
.stats span { font-size: 12px; color: var(--muted); }
.bar { height: 8px; border-radius: 4px; background: var(--love); }
table.st { width: 100%; border-collapse: collapse; font-size: 13px; }
table.st td { padding: 4px 4px; border-bottom: 1px solid var(--line); }
table.st td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--muted); }
.copybox { display: flex; gap: 6px; }
.copybox input { flex: 1; min-width: 0; font-size: 12px; }
#toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 50; max-width: 90vw; }
#toast.on { opacity: 1; }
#asideBtn { display: none; }

@media (max-width: 860px) {
  #asideBtn { display: inline-block; }
  aside { position: fixed; top: 0; bottom: 0; left: 0; width: min(360px, 92vw); z-index: 20; transform: translateX(-102%); transition: transform .2s; box-shadow: var(--shadow); }
  aside.open { transform: none; }
  #label { min-width: 0; order: 10; flex-basis: 100%; }
  header { gap: 5px; padding: 6px 8px; }
  header button, .seg button { padding: 5px 8px; }
  #status span, .spacer, #zoomIn, #zoomOut { display: none; }
  #addBtn { margin-left: auto; }
  header h1 { display: none; }
  .gut, .gutter { width: 36px; }
}
</style>
</head>
<body>
<header>
  <button id="asideBtn" title="Ideas, matches and stats">☰</button>
  <h1>💞 Together</h1>
  <button id="prev" title="Previous (←)">‹</button>
  <button id="today" title="Today (t)">Today</button>
  <button id="next" title="Next (→)">›</button>
  <div class="seg" id="mode"><button data-v="week" title="Week (w)">Week</button><button data-v="3day" title="3 days (3)">3 days</button><button data-v="day" title="Day (d)">Day</button></div>
  <div class="seg"><button id="zoomOut" title="Zoom out (−)">−</button><button id="zoomIn" title="Zoom in (+)">＋</button></div>
  <span id="label"></span>
  <span class="spacer"></span>
  <span id="status"><i></i><span>…</span></span>
  <button id="addBtn" class="primary" title="Add a plan or free/flexible time">＋ New</button>
  <button id="shareBtn" title="The shared link">🔗</button>
  <button id="meBtn" title="Switch person"></button>
</header>
<main>
  <aside id="aside"></aside>
  <section id="cal">
    <div id="calHead"></div>
    <div id="calScroll"><div id="calBody"></div></div>
  </section>
</main>
<dialog id="dlg"></dialog>
<div id="toast"></div>
<script type="module" src="app.js?v=3"></script>
</body>
</html>
